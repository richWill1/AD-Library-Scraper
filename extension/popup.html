<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>AdSnoop</title>
<link rel="stylesheet" href="popup.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <img class="logo" src="wordmark.svg" height="20" alt="AdSnoop">
    <span class="env" id="env" hidden>Preview</span>
    <button class="openapp" id="openapp" type="button">Open AdSnoop <span aria-hidden="true">↗</span></button>
  </div>
  <div class="tab" id="tab" hidden>
    <span class="fav" id="fav" aria-hidden="true"></span>
    <div class="tabtext"><b id="tabhost"></b><span id="tabtitle"></span></div>
  </div>
</header>
<main id="main" aria-live="polite"></main>
<footer class="dock" id="dock" hidden></footer>
<script src="config.js"></script>
<script src="popup.js"></script>
</body>
</html>
